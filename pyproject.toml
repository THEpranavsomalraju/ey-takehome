[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerclf"
version = "1.0.0"
description = "Accounts payable ledger classifier: validated pipeline, calibrated blend model, exact explanations."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "Proprietary - assessment submission" }

[tool.setuptools]
packages = ["ledgerclf"]

[tool.setuptools.package-data]
ledgerclf = ["resources/*.csv"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "dist", "catboost_info", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "D", "RUF"]
ignore = [
    "D105",    # magic methods are self-describing
    "D107",    # __init__ documented on the class
    "N803",    # X for feature matrices follows the scikit-learn estimator convention
    "N806",
    "RUF001",  # ambiguous unicode in strings: escapes are used deliberately in tests
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "N802", "N806"]
"notebooks/**" = ["D", "E402", "E501"]
"tools/**" = ["D100"]
"research/**" = ["D100"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "ledgerclf.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -p no:cacheprovider"
timeout = 120
markers = [
    "slow: training-heavy tests, excluded from the fast gate",
    "edge: edge-case catalog tests",
    "portability: static and subprocess portability checks",
    "golden: comparisons against golden prediction files",
]
filterwarnings = ["error::FutureWarning:ledgerclf.*"]

[tool.coverage.run]
source = ["ledgerclf"]
branch = false

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

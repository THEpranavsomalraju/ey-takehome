name: ci
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'macOS'
        run: brew install libomp
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy ledgerclf
      - run: python -m pytest -m "not slow" -q
      - run: python -m ledgerclf doctor
      - run: python tools/compare_golden.py --tolerance cross-platform

  fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pip uninstall -y lightgbm
      - run: python -m ledgerclf doctor
      - run: python -m pytest tests/edge_cases -k "e01 or e12" -q

  canary-latest:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install numpy pandas scipy scikit-learn lightgbm joblib openpyxl xlrd fastapi uvicorn python-multipart anthropic httpx truststore pytest pytest-timeout hypothesis
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest -m "not slow" -q
